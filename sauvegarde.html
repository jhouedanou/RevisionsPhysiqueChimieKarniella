<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma sauvegarde — Révisions Karniella</title>
<meta name="description" content="Garde tes XP, tes badges et tes scores en ligne, sur tous tes appareils.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#B9366C">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/matieres.css">
<script src="js/theme.js"></script>
<script src="js/programme-5e.js"></script>
<link rel="stylesheet" href="css/coquille.css">
<script src="js/coquille.js"></script>
<script src="js/xp.js"></script>
<script src="js/sauvegarde.js"></script>
<link rel="stylesheet" href="css/jeu.css">
<style>
    .sauvegarde { max-width: 560px; margin: 0 auto; padding: 24px 16px 96px; font-family: var(--police-texte); line-height: 1.5; }
    .sauvegarde h1 { font-family: var(--police-titre); color: var(--rose); margin: 0 0 8px; }
    .sauvegarde .intro { color: var(--doux); margin: 0 0 20px; }
    .carte-sauvegarde {
        background: var(--surface); border: 1px solid var(--bord);
        border-radius: var(--rayon-carte); box-shadow: var(--ombre-clay);
        padding: 20px; margin-bottom: 16px;
    }
    .statut { font-size: 17px; margin: 0; }
    .statut.ok { color: var(--succes-texte); }
    .statut.alerte { color: var(--erreur-texte); }
    .detail { color: var(--doux); margin: 6px 0 0; }
    .form-code { display: flex; gap: 8px; flex-wrap: wrap; }
    .form-code label { width: 100%; font-weight: 700; }
    .form-code input {
        flex: 1 1 200px; font: inherit; padding: 10px 12px; color: var(--encre);
        background: var(--surface-douce); border: 1px solid var(--bord); border-radius: var(--rayon-bouton);
    }
    .outils { display: flex; gap: 8px; flex-wrap: wrap; }
    [hidden] { display: none !important; }
</style>
</head>
<body>

<main class="sauvegarde">
  <h1>☁️ Ma sauvegarde</h1>
  <p class="intro">Tes XP, tes achats, tes badges, tes scores et tes interros sont gardés en ligne.
  Sur un autre téléphone ou ordinateur, tu retrouves tout.</p>

  <section class="carte-sauvegarde" aria-live="polite">
    <p class="statut" id="statut"></p>
    <p class="detail" id="detail" hidden></p>
  </section>

  <section class="carte-sauvegarde" id="zone-code">
    <form class="form-code" id="form-code">
      <label for="code">Code de sauvegarde</label>
      <input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" minlength="8" required>
      <button type="submit" class="btn">Relier cet appareil</button>
    </form>
    <p class="detail">C'est tonton qui te donne le code.</p>
  </section>

  <section class="outils" id="outils" hidden>
    <button type="button" class="btn" id="maintenant">Sauvegarder maintenant</button>
    <button type="button" class="btn btn-ghost" id="delier">Délier cet appareil</button>
  </section>
</main>

<script>
(function () {
    'use strict';
    var S = window.KarniellaSauvegarde;
    var XP = window.KarniellaXP;
    function $(id) { return document.getElementById(id); }

    function ilYa(t) {
        var min = Math.round((Date.now() - t) / 60000);
        if (min < 1) { return 'à l\'instant'; }
        if (min < 60) { return 'il y a ' + min + ' min'; }
        var h = Math.round(min / 60);
        if (h < 24) { return 'il y a ' + h + ' h'; }
        return 'il y a ' + Math.round(h / 24) + ' jours';
    }

    var MESSAGES = {
        code: 'Ce code ne marche pas. Vérifie-le avec tonton.',
        reseau: 'Pas de connexion. La sauvegarde se fera toute seule plus tard.',
        base: 'La sauvegarde n\'est pas encore installée. Préviens tonton.'
    };

    function afficher(message) {
        var e = S.etat();
        var statut = $('statut');
        var detail = $('detail');
        statut.className = 'statut';
        detail.hidden = true;
        $('zone-code').hidden = e.relie;
        $('outils').hidden = !e.relie;

        if (!e.surLeSite) {
            statut.textContent = 'Sur cet ordinateur de test, rien n\'est envoyé.';
        } else if (e.relie) {
            statut.className = 'statut ok';
            statut.textContent = '✅ Cet appareil est relié.';
            detail.hidden = false;
            detail.textContent = (e.dernier ? 'Dernière sauvegarde : ' + ilYa(e.dernier) + '. ' : '') +
                (XP ? 'Tu as ' + XP.solde() + ' XP à dépenser.' : '');
        } else if (e.refuse) {
            statut.className = 'statut alerte';
            statut.textContent = '⚠️ Le code a changé. Demande le nouveau lien à tonton.';
        } else {
            statut.textContent = 'Cet appareil n\'est pas encore relié.';
        }
        if (message) {
            detail.hidden = false;
            detail.textContent = message;
        }
    }

    function relier(code) {
        $('statut').textContent = 'Je relie cet appareil…';
        S.relier(code).then(function (res) {
            afficher(res.ok ? '✅ C\'est fait ! Tout est sauvegardé.' : MESSAGES[res.raison] || '');
        });
    }

    $('form-code').addEventListener('submit', function (ev) {
        ev.preventDefault();
        relier($('code').value);
    });
    $('maintenant').addEventListener('click', function () {
        $('statut').textContent = 'Je sauvegarde…';
        S.synchroniser().then(function (res) { afficher(res.ok ? null : MESSAGES[res.raison] || ''); });
    });
    $('delier').addEventListener('click', function () {
        S.delier();
        afficher('Cet appareil n\'envoie plus rien. Tes XP restent ici.');
    });
    window.addEventListener('karniella:sauvegarde', function () { afficher(); });

    // Le lien envoyé par tonton : sauvegarde.html#code=…
    var m = /[#&]code=([^&]+)/.exec(window.location.hash);
    if (m) {
        var code = decodeURIComponent(m[1]);
        try { window.history.replaceState(null, '', window.location.pathname); } catch (err) { /* rien */ }
        $('code').value = code;
        relier(code);
    } else {
        afficher();
    }
})();
</script>
<script src="js/chat-assistant.js" defer></script>
<script src="js/inscrire-sw.js" defer></script>
</body>
</html>
