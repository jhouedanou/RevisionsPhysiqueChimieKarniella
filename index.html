<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Révisions Karniella — Classe de 5e</title>
<meta name="description" content="Les leçons de 5e de Karniella : anglais, physique-chimie, français, maths, SVT, histoire-géo, EDHC et TICE.">

<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#B9366C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Karniella">
<link rel="apple-touch-icon" href="/icons/icon-192x192.png">

<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/matieres.css">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/accueil.css">
</head>
<body>

<a class="saut-contenu" href="#sommaire">Aller au sommaire</a>

<header class="accueil-entete">
  <div class="enveloppe">
    <a class="marque" href="index.html">
      <span class="marque-signe" aria-hidden="true">🐴</span>
      <strong>Révisions Karniella</strong>
    </a>
    <span class="marque-niveau">Classe de 5<sup>e</sup></span>
  </div>
</header>

<main class="enveloppe">

  <!-- Série de jours, objectif du jour, « Reprendre » : rempli par js/accueil.js
       quand la progression est disponible. Caché sinon. -->
  <section id="mon-galop" class="mon-galop" aria-label="Ma série de révisions" hidden></section>

  <div class="recherche">
    <label for="recherche">Rechercher une matière ou une leçon</label>
    <div class="champ-recherche">
      <span aria-hidden="true">⌕</span>
      <input id="recherche" type="search" autocomplete="off"
             placeholder="Ex. mélange, canteen, circuit…">
      <button id="effacer-recherche" class="effacer-recherche" type="button" hidden>Effacer</button>
    </div>
  </div>

  <p id="recherche-compte" class="recherche-compte" aria-live="polite" hidden></p>

  <p id="recherche-vide" class="recherche-vide" hidden>
    Aucune leçon ne porte ce nom. 🐴 Le mot est peut-être dans le texte d'une leçon :
  </p>

  <!-- Ouvre la recherche complète (js/recherche.js) sur le même mot -->
  <button id="recherche-partout" class="recherche-partout" type="button" hidden></button>

  <!-- Rempli par js/accueil.js depuis js/programme-5e.js -->
  <div id="sommaire"></div>

  <section id="mes-badges" class="mes-badges" aria-labelledby="titre-badges" hidden>
    <h2 id="titre-badges">🏅 Mes badges</h2>
    <p id="badges-compte" class="badges-compte"></p>
    <ul id="liste-badges" class="liste-badges"></ul>
  </section>

</main>

<footer class="accueil-pied">
  <div class="enveloppe">
    <strong>🐴 Révisions Karniella</strong>
    <p>Apprendre, s'entraîner, progresser — une leçon à la fois.</p>
  </div>
</footer>

<script src="js/programme-5e.js"></script>
<script src="js/accueil.js" defer></script>
<script src="js/chat-assistant.js" defer></script>
<script src="js/inscrire-sw.js" defer></script>
</body>
</html>
